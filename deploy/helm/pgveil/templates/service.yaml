apiVersion: v1
kind: Service
metadata:
  name: {{ include "pgveil.fullname" . }}
  labels:
    {{- include "pgveil.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "pgveil.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: proxy
  ports:
    - name: pgwire
      port: {{ .Values.service.wirePort }}
      targetPort: pgwire
      protocol: TCP
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
      protocol: TCP
