global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "pgveil-proxy"
    static_configs:
      - targets: ["pgveil:8088"]
        labels:
          service: "pgveil-proxy"

  - job_name: "pgveil-audit-worker"
    static_configs:
      - targets: ["audit-worker:8089"]
        labels:
          service: "pgveil-audit-worker"
