name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Build Embedded Web Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: internal/webui/dist

  go-test:
    name: Go Test (-race) & Benchmarks
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/webui/dist
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet & Race Tests with Coverage
        run: |
          go vet ./...
          go test -race -count=1 -coverprofile=coverage.out -covermode=atomic -v ./...
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          fail_ci_if_error: false
      - name: Policy Config Validation
        run: go run ./cmd/pgveil validate --config configs/pgveil.yaml
      - name: Microbenchmarks
        run: go test -bench=. -benchmem -benchtime=200ms ./internal/pii/... ./internal/firewall/...
      - name: Build Binaries
        run: |
          go build -o bin/pgveil ./cmd/pgveil
          CGO_ENABLED=0 go build -o bin/pgveil-audit-worker ./cmd/audit-worker

  helm-lint:
    name: Kubernetes Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          helm lint deploy/helm/pgveil
          helm template pgveil deploy/helm/pgveil > /dev/null

  docker-build:
    name: Multi-Stage Docker Verification
    runs-on: ubuntu-latest
    needs: [go-test, helm-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: pgveil
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: audit-worker
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
