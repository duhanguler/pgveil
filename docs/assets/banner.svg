    <path d="M42 16 L66 26 V44 C66 59 55 68 42 73 C29 68 18 59 18 44 V26 Z" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M32 43 L39 50 L53 35" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
